name: WeatherEdgeflow PAPER scan

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: weatheredgeflow-paper-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      APP_ENV: github-actions
      DATABASE_URL: sqlite:///./data/weatheredgeflow-actions.sqlite3
      LOG_FILE: ./data/weatheredgeflow-actions.log
      LOG_LEVEL: INFO
      VENUE: KALSHI
      MODE: PAPER
      INITIAL_BANKROLL_USD: "10.00"
      PAPER_BANKROLL_USD: "10.00"
      MAX_POSITION_PERCENT: "10"
      MAX_POSITION_USD: "1.00"
      MAX_TOTAL_EXPOSURE_PERCENT: "25"
      MAX_DAILY_LOSS_PERCENT: "10"
      MAX_DRAWDOWN_PERCENT: "30"
      MIN_NET_EDGE: "0.10"
      MIN_CONFIDENCE: "55"
      MAX_SPREAD: "0.08"
      SCAN_INTERVAL_MINUTES: "20"
      USER_TIMEZONE: America/Argentina/Buenos_Aires
      SAFETY_MARGIN: "0.03"
      ACTIONABLE_HORIZON_HOURS: "24"
      PREFERRED_HORIZON_HOURS: "24"
      MAX_MARKETS_PER_SCAN: "250"
      KALSHI_BASE_URL: https://external-api.kalshi.com/trade-api/v2
      KALSHI_SERIES_TICKERS: KXHIGHNY,KXHIGHCHI,KXHIGHMIA,KXHIGHLAX,KXHIGHDEN
      OPENMETEO_FORECAST_BASE_URL: https://api.open-meteo.com/v1
      OPENMETEO_GEOCODING_BASE_URL: https://geocoding-api.open-meteo.com/v1
      NOAA_BASE_URL: https://api.weather.gov
      HTTP_TIMEOUT_SECONDS: "12"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PAPER scan
        run: python -m app.jobs.run_paper_scan

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: weatheredgeflow-paper-scan
          path: |
            reports/latest_scan.json
            reports/latest_scan.md
            data/weatheredgeflow-actions.sqlite3
            data/weatheredgeflow-actions.log
          if-no-files-found: error
